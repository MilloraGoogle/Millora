<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millora</title>
<style>
:root {
  --bg: #ffffff;
  --text: #202124;
  --muted: #70757a;
  --surface: #f3f4f8;
  --border: #e2e3ea;
  --accent: #8064e9;
}
body.dark {
  --bg: #171821;
  --text: #f2f1f7;
  --muted: #aaa8b5;
  --surface: #252633;
  --border: #3b3c4b;
  --accent: #a18aff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  transition: background .2s, color .2s;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px clamp(18px, 5vw, 64px);
}
.brand { font-size: 23px; font-weight: 750; letter-spacing: -.7px; }
.brand span, .logo span { color: var(--accent); }
button {
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 14px;
  cursor: pointer;
}
#themeButton {
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
}
main {
  text-align: center;
  padding: 105px 18px 30px;
}
.logo {
  font-size: clamp(56px, 10vw, 78px);
  font-weight: 800;
  letter-spacing: -5px;
}
.subtitle { color: var(--muted); margin: 12px 0 34px; }
.searchbox {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(620px, 100%);
  margin: 0 auto;
  padding: 7px 8px 7px 20px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
}
.searchbox:focus-within { border-color: var(--accent); }
input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  padding: 12px 0;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}
#searchButton {
  color: white;
  background: var(--accent);
  font-weight: 650;
}
.hint { color: var(--muted); font-size: 13px; margin-top: 22px; }
footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 40px 18px;
}
@media (max-width: 480px) {
  main { padding-top: 75px; }
  .logo { letter-spacing: -3px; }
  .searchbox { padding-left: 14px; }
  #searchButton { padding: 11px 14px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Mill<span>ora</span></div>
  <button id="themeButton" type="button">☾ Dark mode</button>
</header>

<main>
  <div class="logo">Mill<span>ora</span></div>
  <div class="subtitle">Search the world. Discover something new.</div>

  <!-- The browser submits the search directly to Google. -->
  <form class="searchbox" action="https://www.google.com/search" method="GET">
    <input
      type="search"
      name="q"
      placeholder="Search anything..."
      aria-label="Search Google"
      autocomplete="off"
      required>
    <button id="searchButton" type="submit">Search</button>
  </form>

  <div class="hint">Press Enter or click Search to search with Google.</div>
</main>

<footer>Millora · Your search starts here</footer>

<script>
const themeButton = document.getElementById("themeButton");

function setTheme(isDark) {
  document.body.classList.toggle("dark", isDark);
  themeButton.textContent = isDark ? "☀ Light mode" : "☾ Dark mode";
  try {
    localStorage.setItem("millora-theme", isDark ? "dark" : "light");
  } catch (error) {}
}

try {
  setTheme(localStorage.getItem("millora-theme") === "dark");
} catch (error) {
  setTheme(false);
}

themeButton.addEventListener("click", function () {
  setTheme(!document.body.classList.contains("dark"));
});
</script>
</body>
</html>
