<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millora</title>
<style>
:root{--bg:#fff;--text:#202124;--muted:#70757a;--surface:#f3f4f8;--border:#e2e3ea;--accent:#8064e9}
body.dark{--bg:#171821;--text:#f2f1f7;--muted:#aaa8b5;--surface:#252633;--border:#3b3c4b;--accent:#a18aff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
.browser-bar{display:flex;gap:7px;padding:12px;background:var(--surface);border-bottom:1px solid var(--border)}
.browser-bar input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text)}
.browser-bar button{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.sites-toolbar{display:flex;justify-content:flex-end;padding:8px;background:var(--surface)}
.sites-toolbar button,.primary{background:var(--accent);color:white}
.website-creator,#editorPanel{width:min(500px,calc(100% - 30px));margin:15px auto;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13px;margin-top:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 5%}
.brand{font-size:23px;font-weight:bold}
.brand span,.logo span{color:var(--accent)}
.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
main{text-align:center;padding:90px 18px 30px}
.logo{font-size:clamp(55px,10vw,78px);font-weight:800;letter-spacing:-5px}
.subtitle,.hint{color:var(--muted)}
.subtitle{margin:12px 0 30px}
.searchbox{display:flex;gap:8px;width:min(620px,100%);margin:auto;padding:7px 8px 7px 20px;border:1px solid var(--border);border-radius:30px;background:var(--surface)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;margin:0}
.searchbox button{background:var(--accent);color:white}
.hint{font-size:13px;margin-top:20px}
#sitesList{width:min(620px,100%);margin:35px auto;text-align:left}
.site-card{padding:15px;margin:10px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.site-card p{color:var(--muted);font-size:13px}
.site-card button{background:var(--accent);color:white;margin:4px}
.site-card .delete-site{background:var(--bg);color:var(--text);border:1px solid var(--border)}
#siteViewer{width:min(900px,calc(100% - 30px));min-height:300px;margin:25px auto;padding:30px;border:1px solid var(--border);border-radius:16px;overflow-wrap:anywhere}
#siteViewer h1{font-size:36px}
#siteViewer p{white-space:pre-wrap;line-height:1.7}
#siteViewer .site-button{display:inline-block;margin:7px;padding:12px 18px;border-radius:9px;text-decoration:none}
#accountPanel{display:none;width:min(390px,100%);margin:35px auto;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-align:left}
#accountPanel.open{display:block}
#status{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#logoutButton{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:40px 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
[hidden]{display:none!important}
@media(max-width:480px){main{padding-top:65px}.browser-bar{padding:7px;gap:4px}.browser-bar button{padding:9px 10px}header{flex-wrap:wrap}}
</style>
</head>
<body>

<nav class="browser-bar">
<button id="backButton" title="Back">←</button>
<button id="forwardButton" title="Forward">→</button>
<button id="refreshButton" title="Refresh">⟳</button>
<input id="urlBar" placeholder="Enter a URL or millora:// address..." aria-label="Address bar">
<button id="goButton">Go</button>
</nav>

<div class="sites-toolbar">
<button id="createWebsiteButton">+ Create Website</button>
</div>

<div id="websiteCreator" class="website-creator" hidden>
<h2>Create a Website</h2>
<label>Website name</label>
<input id="newSiteName" placeholder="My Website">
<label>Custom website URL</label>
<div style="display:flex;align-items:center;gap:5px">millora://<input id="newSiteUrl" placeholder="mywebsite"></div>
<label>Website content</label>
<textarea id="newSiteContent" placeholder="Write something about your website..."></textarea>
<label>Visibility</label>
<select id="siteVisibility">
<option value="private">Private — only on this browser</option>
<option value="public">Public — saved preference</option>
</select>
<div class="actions">
<button class="primary" id="saveWebsiteButton">Create</button>
<button class="secondary" id="closeWebsiteCreator">Cancel</button>
</div>
</div>

<header>
<div class="brand">Mill<span>ora</span></div>
<div>
<button class="secondary" id="accountButton">Log in / Sign up</button>
<button class="secondary" id="themeButton">☾ Dark mode</button>
</div>
</header>

<main id="homePage">
<div class="logo">Mill<span>ora</span></div>
<div class="subtitle">Search the world. Discover something new.</div>
<form class="searchbox" action="https://www.google.com/search" method="GET">
<input type="search" name="q" placeholder="Search anything..." required>
<button type="submit">Search</button>
</form>
<div class="hint">Press Enter or click Search to search with Google.</div>

<section id="sitesList">
<h2>Your websites</h2>
<div id="sitesContainer"></div>
</section>

<section id="accountPanel">
<h2 id="accountHeading">Your Millora account</h2>
<p id="accountDescription">Create an account or log in.</p>
<div id="authFields">
<label>Email</label><input id="email" type="email" placeholder="Your email">
<label>Password</label><input id="password" type="password" placeholder="At least 6 characters">
<div class="actions">
<button class="primary" id="signupButton">Sign up</button>
<button class="secondary" id="loginButton">Log in</button>
</div>
</div>
<button id="logoutButton" class="secondary">Log out</button>
<p id="status">Loading account system...</p>
</section>
</main>

<section id="siteViewer" hidden></section>
<footer>Millora · Your search starts here</footer>

<script>
const $=id=>document.getElementById(id);
const urlBar=$("urlBar"),homePage=$("homePage"),siteViewer=$("siteViewer"),creator=$("websiteCreator");

function getSites(){
 try{
  const s=JSON.parse(localStorage.getItem("milloraSites")||"[]");
  return Array.isArray(s)?s:[];
 }catch{return []}
}
function saveSites(sites){localStorage.setItem("milloraSites",JSON.stringify(sites))}
function getDesign(site){
 return site.design||{background:"#ffffff",color:"#202124",buttonColor:"#8064e9",layout:"left"};
}
function renderSites(){
 const box=$("sitesContainer");box.replaceChildren();
 const sites=getSites();
 if(!sites.length){box.textContent="You haven't created any websites yet.";return}
 sites.forEach(site=>{
  const card=document.createElement("div");card.className="site-card";
  const h=document.createElement("h3");h.textContent=site.name;
  const p=document.createElement("p");p.textContent="millora://"+site.slug+" · "+site.visibility;
  const open=document.createElement("button");open.textContent="Open website";open.onclick=()=>openSavedSite(site.slug);
  const edit=document.createElement("button");edit.textContent="Edit website";edit.onclick=()=>openSavedSite(site.slug,true);
  const del=document.createElement("button");del.textContent="Delete";del.className="delete-site";
  del.onclick=()=>{if(confirm("Delete "+site.name+"?")){saveSites(getSites().filter(x=>x.slug!==site.slug));renderSites()}};
  card.append(h,p,open,edit,del);box.append(card);
 });
}

function showHome(){
 siteViewer.hidden=true;homePage.hidden=false;urlBar.value="";
}
function openSavedSite(slug,editMode=false){
 const site=getSites().find(s=>s.slug===slug);
 if(!site){alert("Millora couldn't find that website.");return}
 homePage.hidden=true;siteViewer.hidden=false;siteViewer.replaceChildren();
 const design=getDesign(site);
 siteViewer.style.background=design.background;
 siteViewer.style.color=design.color;
 siteViewer.style.textAlign=design.layout==="center"?"center":"left";
 siteViewer.style.maxWidth=design.layout==="wide"?"1100px":"900px";

 const back=document.createElement("button");back.textContent="← Back to Millora";back.className="secondary";back.onclick=showHome;
 const address=document.createElement("p");address.textContent="millora://"+site.slug;address.style.color="var(--muted)";
 const title=document.createElement("h1");title.textContent=site.name;
 const content=document.createElement("p");content.textContent=site.content;
 siteViewer.append(back,address,title,content);

 (site.buttons||[]).forEach(b=>{
  const a=document.createElement("a");a.className="site-button";a.textContent=b.label;
  a.href=b.url;a.target="_blank";a.rel="noopener noreferrer";
  a.style.background=design.buttonColor;a.style.color="#fff";siteViewer.append(a);
 });

 const edit=document.createElement("button");edit.textContent=editMode?"Close editor":"Edit website";edit.className="primary";edit.style.marginTop="20px";
 edit.onclick=()=>openSavedSite(slug,!editMode);siteViewer.append(edit);
 if(editMode)renderEditor(site);
 urlBar.value="millora://"+site.slug;
}

function renderEditor(site){
 const old=$("editorPanel");if(old)old.remove();
 const d=getDesign(site);
 const panel=document.createElement("div");panel.id="editorPanel";
 panel.innerHTML=`
 <h2>Website Visual Editor</h2>
 <label>Website title</label><input id="editTitle">
 <label>Website text / content</label><textarea id="editContent"></textarea>
 <label>Background color</label><input id="editBackground" type="color">
 <label>Text color</label><input id="editColor" type="color">
 <label>Button color</label><input id="editButtonColor" type="color">
 <label>Layout</label><select id="editLayout"><option value="left">Left aligned</option><option value="center">Centered</option><option value="wide">Wide</option></select>
 <h3>Website buttons</h3>
 <label>Button text</label><input id="buttonLabel" placeholder="Visit my page">
 <label>Button link</label><input id="buttonUrl" placeholder="https://example.com">
 <button id="addSiteButton" class="secondary">+ Add button</button>
 <div id="buttonList"></div>
 <div class="actions"><button id="saveDesign" class="primary">Save changes</button><button id="cancelDesign" class="secondary">Cancel</button></div>
 <p id="editorStatus" style="color:var(--muted);font-size:13px">Changes are saved only when you press Save changes.</p>`;
 siteViewer.append(panel);

 $("editTitle").value=site.name;
 $("editContent").value=site.content;
 $("editBackground").value=d.background;
 $("editColor").value=d.color;
 $("editButtonColor").value=d.buttonColor;
 $("editLayout").value=d.layout;

 let buttons=[...(site.buttons||[])];
 function showButtons(){
  const list=$("buttonList");list.replaceChildren();
  buttons.forEach((b,i)=>{
   const row=document.createElement("div");row.className="site-card";
   const label=document.createElement("span");label.textContent=b.label+" — "+b.url+" ";
   const remove=document.createElement("button");remove.textContent="Remove";remove.className="delete-site";
   remove.onclick=()=>{buttons.splice(i,1);showButtons()};
   row.append(label,remove);list.append(row);
  });
 }
 showButtons();

 $("addSiteButton").onclick=()=>{
  const label=$("buttonLabel").value.trim(),url=$("buttonUrl").value.trim();
  if(!label||!url){alert("Enter button text and a link.");return}
  if(!/^https?:\/\//i.test(url)){alert("Use a link starting with https:// or http://");return}
  buttons.push({label,url});$("buttonLabel").value="";$("buttonUrl").value="";showButtons();
 };
 $("saveDesign").onclick=()=>{
  const sites=getSites(),index=sites.findIndex(s=>s.slug===site.slug);
  if(index<0)return;
  sites[index].name=$("editTitle").value.trim()||"Untitled website";
  sites[index].content=$("editContent").value;
  sites[index].design={
   background:$("editBackground").value,
   color:$("editColor").value,
   buttonColor:$("editButtonColor").value,
   layout:$("editLayout").value
  };
  sites[index].buttons=buttons;
  try{saveSites(sites)}catch{alert("Couldn't save. Browser storage may be full.");return}
  renderSites();openSavedSite(site.slug,true);
  $("editorStatus").textContent="Saved!";
 };
 $("cancelDesign").onclick=()=>openSavedSite(site.slug,false);
}

function goToMilloraURL(input){
 const url=input.trim();if(!url)return;
 if(/^millora:\/\//i.test(url)){
  const slug=url.slice(10).split("/")[0].toLowerCase();
  if(getSites().some(s=>s.slug===slug)){openSavedSite(slug);return}
  const shortcuts={youtube:"https://www.youtube.com",google:"https://www.google.com",roblox:"https://www.roblox.com",github:"https://github.com"};
  if(shortcuts[slug]){location.href=shortcuts[slug];return}
  alert("Millora couldn't find: "+slug);return;
 }
 if(/^https?:\/\//i.test(url)){location.href=url;return}
 if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(url)){location.href="https://"+url;return}
 location.href="https://www.google.com/search?q="+encodeURIComponent(url);
}
$("goButton").onclick=()=>goToMilloraURL(urlBar.value);
urlBar.addEventListener("keydown",e=>{if(e.key==="Enter")goToMilloraURL(urlBar.value)});
$("backButton").onclick=()=>!siteViewer.hidden?showHome():history.back();
$("forwardButton").onclick=()=>history.forward();
$("refreshButton").onclick=()=>!siteViewer.hidden?openSavedSite(urlBar.value.slice(10)):location.reload();

function setTheme(dark){
 document.body.classList.toggle("dark",dark);
 $("themeButton").textContent=dark?"☀ Light mode":"☾ Dark mode";
 localStorage.setItem("millora-theme",dark?"dark":"light");
}
setTheme(localStorage.getItem("millora-theme")==="dark");
$("themeButton").onclick=()=>setTheme(!document.body.classList.contains("dark"));
$("accountButton").onclick=()=>$("accountPanel").classList.toggle("open");

$("createWebsiteButton").onclick=()=>creator.hidden=!creator.hidden;
$("closeWebsiteCreator").onclick=()=>creator.hidden=true;
$("saveWebsiteButton").onclick=()=>{
 const name=$("newSiteName").value.trim(),slug=$("newSiteUrl").value.trim().toLowerCase(),content=$("newSiteContent").value.trim(),visibility=$("siteVisibility").value;
 if(!name||!slug||!content){alert("Please fill in all the fields!");return}
 if(!/^[a-z0-9-]+$/.test(slug)){alert("Use lowercase letters, numbers, and hyphens in your URL.");return}
 const sites=getSites();
 if(sites.some(s=>s.slug===slug)){alert("That Millora URL is already taken!");return}
 sites.push({name,slug,content,visibility,design:{background:"#ffffff",color:"#202124",buttonColor:"#8064e9",layout:"left"},buttons:[]});
 try{saveSites(sites)}catch{alert("Couldn't save your website. Browser storage may be full.");return}
 ["newSiteName","newSiteUrl","newSiteContent"].forEach(id=>$(id).value="");
 $("siteVisibility").value="private";creator.hidden=true;renderSites();
 alert("Website created! Open millora://"+slug);
};
renderSites();
</script>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://xkvbhfjezmxipbqynezs.supabase.co";
const SUPABASE_KEY="sb_publishable_w_IiOxzbLWvj7nT8S4fvUg_R-C1GtTY";
const status=document.getElementById("status"),authFields=document.getElementById("authFields"),logoutButton=document.getElementById("logoutButton");
try{
 const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
 function showUser(user){
  if(user){
   document.getElementById("accountHeading").textContent="You're logged in!";
   document.getElementById("accountDescription").textContent=user.email||"Your account is active.";
   authFields.style.display="none";logoutButton.style.display="block";document.getElementById("accountButton").textContent="My account";
  }else{
   document.getElementById("accountHeading").textContent="Your Millora account";
   document.getElementById("accountDescription").textContent="Create an account or log in.";
   authFields.style.display="block";logoutButton.style.display="none";document.getElementById("accountButton").textContent="Log in / Sign up";
  }
 }
 function credentials(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||!password){status.textContent="Enter your email and password.";return null}
  if(password.length<6){status.textContent="Password must be at least 6 characters.";return null}
  return {email,password};
 }
 document.getElementById("signupButton").onclick=async()=>{
  const d=credentials();if(!d)return;status.textContent="Creating account...";
  const {data,error}=await supabase.auth.signUp(d);
  status.textContent=error?error.message:data.session?"Account created!":"Account created! Check your email to confirm it.";
 };
 document.getElementById("loginButton").onclick=async()=>{
  const d=credentials();if(!d)return;status.textContent="Logging in...";
  const {error}=await supabase.auth.signInWithPassword(d);status.textContent=error?error.message:"Logged in successfully!";
 };
 logoutButton.onclick=async()=>{
  status.textContent="Logging out...";const {error}=await supabase.auth.signOut();status.textContent=error?error.message:"Logged out.";
 };
 const {data,error}=await supabase.auth.getSession();
 if(error)status.textContent=error.message;
 else{showUser(data.session?.user??null);status.textContent=data.session?"Account connected.":"Ready to sign in."}
 supabase.auth.onAuthStateChange((_event,session)=>showUser(session?.user??null));
}catch(error){status.textContent="Account system error: "+error.message}
</script>
</body>
</html>
