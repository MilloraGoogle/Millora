<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millora</title>

<style>
:root{--bg:#fff;--text:#202124;--muted:#70757a;--surface:#f3f4f8;--border:#e2e3ea;--accent:#8064e9}
body.dark{--bg:#171821;--text:#f2f1f7;--muted:#aaa8b5;--surface:#252633;--border:#3b3c4b;--accent:#a18aff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.browser-bar{display:flex;gap:7px;padding:12px;background:var(--surface);border-bottom:1px solid var(--border)}
.browser-bar input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text)}
.browser-bar button{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.sites-toolbar{display:flex;justify-content:flex-end;padding:8px;background:var(--surface)}
.sites-toolbar button,.primary{background:var(--accent);color:white}
.website-creator,#editorPanel{width:min(500px,calc(100% - 30px));margin:15px auto;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13px;margin-top:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 5%}
.brand{font-size:23px;font-weight:bold}
.brand span,.logo span{color:var(--accent)}
.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
main{text-align:center;padding:90px 18px 30px}
.logo{font-size:clamp(55px,10vw,78px);font-weight:800;letter-spacing:-5px}
.subtitle,.hint{color:var(--muted)}
.subtitle{margin:12px 0 30px}
.searchbox{display:flex;gap:8px;width:min(620px,100%);margin:auto;padding:7px 8px 7px 20px;border:1px solid var(--border);border-radius:30px;background:var(--surface)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;margin:0}
.searchbox button{background:var(--accent);color:white}
.hint{font-size:13px;margin-top:20px}
#sitesList{width:min(620px,100%);margin:35px auto;text-align:left}
.site-card{padding:15px;margin:10px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.site-card p{color:var(--muted);font-size:13px}
.site-card button{background:var(--accent);color:white;margin:4px}
.site-card .delete-site{background:var(--bg);color:var(--text);border:1px solid var(--border)}
#siteViewer{width:min(900px,calc(100% - 30px));min-height:300px;margin:25px auto;padding:30px;border:1px solid var(--border);border-radius:16px;overflow-wrap:anywhere}
#siteViewer h1{font-size:36px}
#siteViewer p{white-space:pre-wrap;line-height:1.7}
#siteViewer .site-button{display:inline-block;margin:7px;padding:12px 18px;border-radius:9px;text-decoration:none}

#accountPanel{display:none;width:min(1100px,calc(100% - 30px));margin:35px auto;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-align:left}
#accountPanel.open{display:block}
#status{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#logoutButton{display:none}
#profileArea{margin-top:18px}
.profile-card{padding:18px;border:1px solid var(--border);border-radius:15px;background:var(--bg);margin:12px 0}
.millbucks-card{padding:18px;border:1px solid var(--border);border-radius:15px;background:var(--bg);margin:12px 0}
.millbucks-balance{font-size:32px;font-weight:800;color:var(--accent);margin:8px 0}
.millbucks-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.millbucks-list{padding:0;margin:8px 0;list-style:none}
.millbucks-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.millbucks-list li:last-child{border-bottom:0}
.millbucks-muted{font-size:12px;color:var(--muted)}
@media(max-width:600px){.millbucks-columns{grid-template-columns:1fr}}

.profile-avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:26px;font-weight:bold;background:var(--accent);margin-bottom:12px;cursor:pointer}
.profile-avatar img,.hover-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.profile-bio{white-space:pre-wrap;line-height:1.5}
.profile-sites{margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:40px 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ai-panel{margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.ai-panel h3{margin:0 0 8px}
.ai-status{font-size:13px;color:var(--muted);white-space:pre-wrap}
.ai-preview{width:100%;height:420px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-top:10px}
#avatarFile{display:none}
.profile-hover-card{position:fixed;z-index:9999;width:min(300px,calc(100vw - 24px));padding:15px;border:1px solid var(--border);border-radius:15px;background:var(--bg);box-shadow:0 12px 35px #0003;text-align:left;display:none}
.profile-hover-card.visible{display:block}
.hover-top{display:flex;align-items:center;gap:11px}
.hover-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex-shrink:0;color:white;font-weight:bold;background:var(--accent)}
.hover-name{font-weight:bold}
.hover-username{font-size:12px;color:var(--muted);margin-top:3px}
.hover-bio{font-size:13px;line-height:1.45;margin:12px 0}
.hover-count{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
[hidden]{display:none!important}

#friendsPanel{margin-top:22px;padding:16px;border:1px solid var(--border);border-radius:15px;background:var(--bg)}
#friendsPanel h3{margin:0 0 10px}
.friends-section{margin-top:18px}
.friend-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.friend-row:last-child{border-bottom:0}
.friend-mini-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:#fff;font-weight:bold;background:var(--accent)}
.friend-mini-avatar img{width:100%;height:100%;object-fit:cover}
.friend-row-info{flex:1;min-width:0}
.friend-row-info strong{display:block;overflow-wrap:anywhere}
.friend-row-info small{color:var(--muted)}
.friend-row-actions{display:flex;gap:6px;flex-wrap:wrap}
.friend-row-actions button{padding:8px 10px}
.friend-note{font-size:13px;color:var(--muted)}

#messagesPanel{margin-top:22px;padding:20px;border:1px solid var(--border);border-radius:15px;background:var(--bg);width:100%}
.messages-layout{display:grid;grid-template-columns:minmax(200px,.65fr) minmax(0,2fr);gap:18px;width:100%}
#messageContacts,#messageThread{border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
#messageContacts{max-height:500px;overflow:auto}
#messageThread{display:flex;flex-direction:column;min-height:400px;width:100%}
#messageList{display:flex;flex-direction:column;gap:9px;flex:1;max-height:420px;overflow:auto;padding:8px 2px}
.message-bubble{max-width:85%;padding:10px 12px;border-radius:13px;background:var(--surface);overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4}
.message-bubble.mine{align-self:flex-end;background:var(--accent);color:#fff}
.message-time{display:block;font-size:10px;opacity:.72;margin-top:5px}
.message-compose{display:flex;gap:7px;align-items:flex-end;margin-top:10px;width:100%}
.message-compose input{margin:0;min-width:0;flex:1}
.message-compose button{white-space:nowrap}
.message-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.message-tools button{padding:8px 10px}
.message-placeholder{color:var(--muted);font-size:13px;padding:15px 4px}
.message-image{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-top:7px}
#messageImagePreview img{display:block;max-width:220px;max-height:180px;object-fit:contain;border-radius:10px;margin-top:8px}
.emoji-tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.emoji-tools button{padding:7px 10px;background:var(--surface);border:1px solid var(--border);font-size:17px}
#messageImagePreview{font-size:13px;color:var(--muted)}
@media(max-width:600px){
 .messages-layout{grid-template-columns:1fr}
 #messageContacts{max-height:220px}
}
</style>
