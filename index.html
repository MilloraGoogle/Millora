<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millora</title>

<style>
:root {
  --bg: #fff;
  --text: #202124;
  --muted: #70757a;
  --surface: #f3f4f8;
  --border: #e2e3ea;
  --accent: #8064e9;
}

body.dark {
  --bg: #171821;
  --text: #f2f1f7;
  --muted: #aaa8b5;
  --surface: #252633;
  --border: #3b3c4b;
  --accent: #a18aff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  transition: background .2s, color .2s;
}

/* BROWSER BAR */
.browser-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  width: 100%;
}

.browser-bar input {
  flex: 1;
  min-width: 0;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
  caret-color: var(--accent);
}

.browser-bar input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.browser-bar input:focus {
  border-color: var(--accent);
}

.browser-bar button {
  padding: 10px 14px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
}

.browser-bar button:hover {
  border-color: var(--accent);
}

/* CREATE WEBSITE BUTTON */
.sites-toolbar {
  display: flex;
  justify-content: flex-end;
  padding: 5px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.sites-toolbar button {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-size: 12px;
}

/* WEBSITE CREATOR */
.website-creator {
  width: min(420px, calc(100% - 30px));
  margin: 12px 18px 12px auto;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.website-creator h2 {
  margin-top: 0;
  font-size: 19px;
}

.website-creator input,
.website-creator textarea {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

.website-creator textarea {
  min-height: 100px;
  resize: vertical;
}

.creator-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.creator-actions button {
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
}

#saveWebsiteButton {
  background: var(--accent);
  color: white;
}

#closeWebsiteCreator {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 22px clamp(18px, 5vw, 64px);
}

.brand {
  font-size: 23px;
  font-weight: 750;
}

.brand span, .logo span {
  color: var(--accent);
}

button {
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 14px;
  cursor: pointer;
}

#themeButton, #accountButton, .secondary {
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
}

main {
  text-align: center;
  padding: 105px 18px 30px;
}

.logo {
  font-size: clamp(56px, 10vw, 78px);
  font-weight: 800;
  letter-spacing: -5px;
}

.subtitle {
  color: var(--muted);
  margin: 12px 0 34px;
}

.searchbox {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(620px, 100%);
  margin: 0 auto;
  padding: 7px 8px 7px 20px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
}

.searchbox:focus-within {
  border-color: var(--accent);
}

input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  padding: 12px 0;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

#searchButton, .primary {
  color: white;
  background: var(--accent);
  font-weight: 650;
}

.hint {
  color: var(--muted);
  font-size: 13px;
  margin-top: 22px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 40px 18px;
}

#accountPanel {
  display: none;
  width: min(390px, 100%);
  margin: 35px auto 0;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  text-align: left;
}

#accountPanel.open {
  display: block;
}

#accountPanel h2 {
  margin-top: 0;
}

#accountPanel label {
  display: block;
  margin: 14px 0 6px;
  font-size: 13px;
}

#accountPanel input {
  display: block;
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
}

.account-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.account-actions button {
  flex: 1;
}

#status {
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

#logoutButton {
  display: none;
}

@media(max-width:480px) {
  main {
    padding-top: 75px;
  }

  .logo {
    letter-spacing: -3px;
  }

  header {
    flex-wrap: wrap;
  }

  .browser-bar {
    gap: 5px;
    padding: 9px 7px;
  }

  .browser-bar button {
    padding: 10px;
  }

  .browser-bar input {
    padding: 10px;
    font-size: 13px;
  }

  .sites-toolbar {
    padding: 5px 7px;
  }
}
</style>
</head>

<body>

<!-- BROWSER NAVIGATION -->
<nav class="browser-bar">
  <button id="backButton" type="button" title="Back">←</button>
  <button id="forwardButton" type="button" title="Forward">→</button>
  <button id="refreshButton" type="button" title="Refresh">⟳</button>

  <input
    id="urlBar"
    type="text"
    placeholder="Enter a URL or millora:// address..."
    aria-label="Address bar"
  >

  <button id="goButton" type="button">Go</button>
</nav>

<!-- CREATE WEBSITE BUTTON -->
<div class="sites-toolbar">
  <button id="createWebsiteButton" type="button">
    + Create Website
  </button>
</div>

<!-- WEBSITE CREATOR -->
<div id="websiteCreator" class="website-creator" hidden>
  <h2>Create a Website</h2>

  <input
    id="newSiteName"
    type="text"
    placeholder="Website name..."
  >

  <textarea
    id="newSiteContent"
    placeholder="Describe your website..."
  ></textarea>

  <div class="creator-actions">
    <button id="saveWebsiteButton" type="button">Save</button>
    <button id="closeWebsiteCreator" type="button">Cancel</button>
  </div>
</div>

<header>
  <div class="brand">Mill<span>ora</span></div>
  <div>
    <button id="accountButton" type="button">Log in / Sign up</button>
    <button id="themeButton" type="button">☾ Dark mode</button>
  </div>
</header>

<main>
  <div class="logo">Mill<span>ora</span></div>
  <div class="subtitle">Search the world. Discover something new.</div>

  <form class="searchbox"
        action="https://www.google.com/search"
        method="GET">
    <input type="search" name="q"
           placeholder="Search anything..."
           aria-label="Search Google" required>
    <button id="searchButton" type="submit">Search</button>
  </form>

  <div class="hint">Press Enter or click Search to search with Google.</div>

  <section id="accountPanel">
    <h2 id="accountHeading">Your Millora account</h2>
    <p id="accountDescription">Create an account or log in.</p>

    <div id="authFields">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Your email">

      <label for="password">Password</label>
      <input id="password" type="password"
             placeholder="At least 6 characters">

      <div class="account-actions">
        <button class="primary" id="signupButton" type="button">Sign up</button>
        <button class="secondary" id="loginButton" type="button">Log in</button>
      </div>
    </div>

    <button id="logoutButton" class="secondary" type="button">Log out</button>
    <p id="status" role="status">Loading account system...</p>
  </section>
</main>

<footer>Millora · Your search starts here</footer>

<!-- NAVIGATION, THEME, WEBSITE CREATOR AND ACCOUNT PANEL -->
<script>
async function goToMilloraURL(input) {
  const url = input.trim();

  if (!url) return;

  if (/^https?:\/\//i.test(url)) {
    window.location.href = url;
    return;
  }

  if (url.toLowerCase().startsWith("millora://")) {
    const name = url
      .slice("millora://".length)
      .split("/")[0]
      .toLowerCase();

    const websites = {
      youtube: "https://www.youtube.com",
      google: "https://www.google.com",
      roblox: "https://www.roblox.com",
      github: "https://github.com",
      reddit: "https://www.reddit.com"
    };

    if (websites[name]) {
      window.location.href = websites[name];
    } else {
      alert("Millora couldn't find: " + name);
    }

    return;
  }

  window.location.href =
    "https://www.google.com/search?q=" +
    encodeURIComponent(url);
}

// Address bar
const urlBar = document.getElementById("urlBar");

function navigateAddressBar() {
  goToMilloraURL(urlBar.value);
}

document.getElementById("goButton")
  .addEventListener("click", navigateAddressBar);

urlBar.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    navigateAddressBar();
  }
});

urlBar.value = window.location.href;

// Browser controls
document.getElementById("backButton").addEventListener("click", () => {
  window.history.back();
});

document.getElementById("forwardButton").addEventListener("click", () => {
  window.history.forward();
});

document.getElementById("refreshButton").addEventListener("click", () => {
  window.location.reload();
});

// Theme
const themeButton = document.getElementById("themeButton");

function setTheme(dark) {
  document.body.classList.toggle("dark", dark);
  themeButton.textContent = dark ? "☀ Light mode" : "☾ Dark mode";

  try {
    localStorage.setItem("millora-theme", dark ? "dark" : "light");
  } catch (e) {}
}

let savedTheme = false;

try {
  savedTheme = localStorage.getItem("millora-theme") === "dark";
} catch (e) {}

setTheme(savedTheme);

themeButton.addEventListener("click", () => {
  setTheme(!document.body.classList.contains("dark"));
});

// Account panel
document.getElementById("accountButton").addEventListener("click", () => {
  document.getElementById("accountPanel").classList.toggle("open");
});

// Millora Sites
const creator = document.getElementById("websiteCreator");

document.getElementById("createWebsiteButton")
  .addEventListener("click", () => {
    creator.hidden = !creator.hidden;
  });

document.getElementById("closeWebsiteCreator")
  .addEventListener("click", () => {
    creator.hidden = true;
  });

document.getElementById("saveWebsiteButton")
  .addEventListener("click", () => {
    const name = document.getElementById("newSiteName").value.trim();
    const content = document.getElementById("newSiteContent").value.trim();

    if (!name) {
      alert("Enter a website name!");
      return;
    }

    let sites = [];

    try {
      sites = JSON.parse(localStorage.getItem("milloraSites") || "[]");
      if (!Array.isArray(sites)) sites = [];
    } catch (e) {
      sites = [];
    }

    sites.push({
      name: name,
      content: content
    });

    localStorage.setItem("milloraSites", JSON.stringify(sites));

    alert("Website saved!");

    document.getElementById("newSiteName").value = "";
    document.getElementById("newSiteContent").value = "";
    creator.hidden = true;
  });
</script>

<!-- SUPABASE ACCOUNT SYSTEM -->
<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://xkvbhfjezmxipbqynezs.supabase.co";

// IMPORTANT: Put your existing Supabase PUBLISHABLE key here.
const SUPABASE_KEY = "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";

const status = document.getElementById("status");
const authFields = document.getElementById("authFields");
const logoutButton = document.getElementById("logoutButton");

if (SUPABASE_KEY.includes("PASTE_")) {
  status.textContent = "Add your Supabase publishable key to activate accounts.";
} else {
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  function showUser(user) {
    if (user) {
      document.getElementById("accountHeading").textContent =
        "You're logged in!";

      document.getElementById("accountDescription").textContent =
        user.email || "Your account is active.";

      authFields.style.display = "none";
      logoutButton.style.display = "block";
      document.getElementById("accountButton").textContent = "My account";
    } else {
      document.getElementById("accountHeading").textContent =
        "Your Millora account";

      document.getElementById("accountDescription").textContent =
        "Create an account or log in.";

      authFields.style.display = "block";
      logoutButton.style.display = "none";

      document.getElementById("accountButton").textContent =
        "Log in / Sign up";
    }
  }

  function credentials() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      status.textContent = "Enter your email and password.";
      return null;
    }

    if (password.length < 6) {
      status.textContent = "Password must be at least 6 characters.";
      return null;
    }

    return { email, password };
  }

  document.getElementById("signupButton").addEventListener("click", async () => {
    const details = credentials();
    if (!details) return;

    status.textContent = "Creating account...";

    const { data, error } = await supabase.auth.signUp(details);

    if (error) {
      status.textContent = error.message;
    } else if (data.session) {
      status.textContent = "Account created!";
    } else {
      status.textContent = "Account created! Check your email to confirm it.";
    }
  });

  document.getElementById("loginButton").addEventListener("click", async () => {
    const details = credentials();
    if (!details) return;

    status.textContent = "Logging in...";

    const { error } =
      await supabase.auth.signInWithPassword(details);

    status.textContent = error ? error.message : "Logged in successfully!";
  });

  logoutButton.addEventListener("click", async () => {
    status.textContent = "Logging out...";

    const { error } = await supabase.auth.signOut();

    status.textContent = error ? error.message : "Logged out.";
  });

  const { data, error } = await supabase.auth.getSession();

  if (error) {
    status.textContent = error.message;
  } else {
    showUser(data.session?.user ?? null);
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    showUser(session?.user ?? null);
  });
}
</script>

</body>
</html>
